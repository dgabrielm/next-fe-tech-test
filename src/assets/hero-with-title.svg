<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" aria-label="Harmoniq - Music Search">
  <defs>
    
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"></stop>
      <stop offset="55%" stop-color="#121826"></stop>
      <stop offset="100%" stop-color="#0a0e17"></stop>
    </linearGradient>

    
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    
    <radialGradient id="spotlight" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#3f51b5" stop-opacity="0.18"></stop>
      <stop offset="70%" stop-color="#3f51b5" stop-opacity="0.04"></stop>
      <stop offset="100%" stop-color="#000" stop-opacity="0"></stop>
    </radialGradient>

    
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"></feDropShadow>
    </filter>
  </defs>

  
  <rect width="1200" height="420" fill="url(#bg)"></rect>
  <rect width="1200" height="420" fill="url(#spotlight)"></rect>

  
  <g opacity="0.55">
    <rect x="80" y="160" width="6" height="40" rx="3" fill="#3f51b5"></rect>
    <rect x="96" y="140" width="6" height="80" rx="3" fill="#3f51b5"></rect>
    <rect x="112" y="120" width="6" height="120" rx="3" fill="#f50057"></rect>
    <rect x="128" y="145" width="6" height="70" rx="3" fill="#3f51b5"></rect>
    <rect x="144" y="155" width="6" height="50" rx="3" fill="#3f51b5"></rect>
    <rect x="160" y="130" width="6" height="100" rx="3" fill="#f50057"></rect>
    <rect x="176" y="150" width="6" height="60" rx="3" fill="#3f51b5"></rect>
  </g>

  
  <g opacity="0.55">
    <rect x="1020" y="155" width="6" height="50" rx="3" fill="#3f51b5"></rect>
    <rect x="1036" y="130" width="6" height="100" rx="3" fill="#f50057"></rect>
    <rect x="1052" y="145" width="6" height="70" rx="3" fill="#3f51b5"></rect>
    <rect x="1068" y="120" width="6" height="120" rx="3" fill="#3f51b5"></rect>
    <rect x="1084" y="140" width="6" height="80" rx="3" fill="#f50057"></rect>
    <rect x="1100" y="160" width="6" height="40" rx="3" fill="#3f51b5"></rect>
  </g>

  
  <g fill="#3f51b5" opacity="0.7">
    <path d="M240 95 c0-6 4-10 10-10 h8 v55 c-6-4-12-6-18-6 -12 0-20 8-20 18s8 18 20 18 20-8 20-18V95h-20z"></path>
    <path d="M920 280 c0-5 3-8 8-8 h6 v42 c-5-3-9-5-14-5 -9 0-15 6-15 14s6 14 15 14 15-6 15-14V280h-15z" opacity="0.6"></path>
    <path d="M310 310 c0-5 3-8 8-8 h6 v40 c-5-3-9-4-13-4 -9 0-15 6-15 14s6 14 15 14 15-6 15-14V310h-16z" opacity="0.5"></path>
  </g>

  
  <circle cx="260" cy="180" r="3" fill="#f50057" opacity="0.8"></circle>
  <circle cx="950" cy="130" r="2.5" fill="#3f51b5" opacity="0.7"></circle>
  <circle cx="200" cy="260" r="2" fill="#f50057" opacity="0.6"></circle>
  <circle cx="980" cy="250" r="3" fill="#3f51b5" opacity="0.5"></circle>

  
  <g transform="translate(600 230)" filter="url(#glow)">
    <circle r="78" fill="#1a2235" stroke="#3f51b5" stroke-width="1.5" opacity="0.9"></circle>
    <circle r="66" fill="none" stroke="#f50057" stroke-width="1" opacity="0.35"></circle>

    
    <line x1="32" y1="32" x2="54" y2="54" stroke="#f50057" stroke-width="9" stroke-linecap="round"></line>

    
    <circle cx="0" cy="0" r="36" fill="none" stroke="#3f51b5" stroke-width="8"></circle>

    
    <g transform="translate(-5 -3)">
      <ellipse cx="-7" cy="10" rx="9.5" ry="7" fill="#f50057" transform="rotate(-20)"></ellipse>
      <rect x="0" y="-24" width="4.5" height="34" rx="1.5" fill="#f50057"></rect>
      <path d="M4.5 -24 Q19 -19 15.5 -5 Q7 -12 4.5 -7 Z" fill="#f50057"></path>
    </g>
  </g>

  
  <g filter="url(#textShadow)" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
    
    <text x="600" y="118" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
      Harmoniq
    </text>

    
    <text x="600" y="158" font-size="22" font-weight="400" fill="#ffffff" opacity="0.78" letter-spacing="0.3">
      Search artists, songs &amp; albums
    </text>
  </g>

  
  <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#3f51b5" stop-opacity="0"></stop>
    <stop offset="30%" stop-color="#3f51b5"></stop>
    <stop offset="70%" stop-color="#f50057"></stop>
    <stop offset="100%" stop-color="#f50057" stop-opacity="0"></stop>
  </linearGradient>
  <rect x="200" y="416" width="800" height="4" fill="url(#accentLine)" opacity="0.7"></rect>
</svg>
